[project]
name = "wimtm-data"
version = "2.0.0"
description = "Union Government of India expenditure, by fiscal year, as an open hierarchical dataset with full source provenance."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.9",
]
# pdfplumber and pypdfium2 used to sit here for tools/extract_expenditure_pdfs.py.
# That extractor is gone (its input and output paths had both stopped existing,
# and it emitted the superseded v1 shape), and nothing else imports them — so a
# package whose whole job is reading JSON no longer pulls a PDF stack. Re-add
# them if PDF extraction returns; `uv add --dev pdfplumber` is one line.

[dependency-groups]
dev = ["pytest>=8.3", "mypy>=1.13", "ruff>=0.8"]

[project.scripts]
wimtm-data = "wimtm_data.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["wimtm_data"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
strict = true

# Ruff is this package's only linter. It used to reach outside the package to
# cover `../prototype`, which had no linter of any kind; the prototype is gone,
# so the target list is now just what lives here. mypy stays scoped to
# `wimtm_data/`, where strict typing is worth the cost.
[tool.ruff]
# 100, not the default 88: the codebase was written before it had a linter and
# already respects 100 almost everywhere. Reflowing trust-critical validation
# code to satisfy a style rule is churn with real risk and no reader benefit.
line-length = 100
# Nothing is excluded any more: `legacy/`, `scripts/` and `tools/` held the
# only unlintable code and all three have been deleted.

[tool.ruff.lint]
# E/F are the defaults; I (import order), B (bugbear) and UP (pyupgrade) are
# cheap and catch real mistakes rather than style opinions.
select = ["E", "F", "I", "B", "UP"]

